name: MIZAN payment expense final release

on:
  push:
    branches: [agent/mizan-payment-expense-final-release]
  pull_request:
    branches: [agent/mizan-final-complete-release]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: "3.44.0"
  SOURCE_ROOT: workspace/LEFFERION-PRIME-MIZAN-MANUAL-OVERDUE-SYNC-FINAL

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout final patch layer
        uses: actions/checkout@v4

      - name: Download exact verified source
        uses: actions/download-artifact@v4
        with:
          name: lefferion-prime-mizan-manual-overdue-sync-source
          repository: isarpsiyahofficial/MIZAN
          run-id: 30090668985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .baseline-artifact

      - name: Restore exact source and apply protected final changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zipfile
          archives = sorted(Path('.baseline-artifact').rglob('*.zip'))
          if len(archives) != 1:
              raise SystemExit(f'Beklenen tek kaynak ZIP bulunamadı: {archives}')
          archive = archives[0]
          expected = 'c87d38b1a6d03ebef79d89df575bf7e4b0f4b8050256aac4532dd8646b8abe48'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Kaynak SHA uyuşmuyor: {actual}')
          shutil.rmtree('workspace', ignore_errors=True)
          Path('workspace').mkdir()
          with zipfile.ZipFile(archive) as source_zip:
              source_zip.extractall('workspace')
          PY
          python3 tools/apply_mizan_final_complete.py "$SOURCE_ROOT"
          python3 tools/fix_people_summary_strings.py "$SOURCE_ROOT"
          python3 tools/apply_mizan_payment_expense_final.py "$SOURCE_ROOT"
          python3 tools/fix_final_validator.py "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/pubspec.yaml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify source, regression tests, responsive layout and release APK
        shell: bash
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          exec > >(tee ci-logs/final-verification.log) 2>&1
          flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan
          python3 tools/configure_android.py
          flutter pub get
          dart format lib test
          dart run flutter_launcher_icons
          flutter analyze --fatal-warnings
          python3 tools/validate_project.py
          flutter test test/combined_expense_totals_test.dart --reporter expanded
          flutter test test/reminder_engine_test.dart test/alarm_regression_test.dart test/automatic_notification_sync_test.dart --reporter expanded
          flutter test test/report_service_test.dart test/pdf_report_test.dart --reporter expanded
          flutter test test/local_store_test.dart test/csv_backup_test.dart test/controller_test.dart --reporter expanded
          flutter test test/performance_scaling_test.dart test/expense_browser_service_test.dart --reporter expanded
          flutter test test/responsive_test.dart test/ui_interaction_test.dart --reporter expanded
          flutter test test/visual_capture_test.dart --update-goldens
          flutter test --reporter expanded
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          root = Path('workspace/LEFFERION-PRIME-MIZAN-MANUAL-OVERDUE-SYNC-FINAL')
          dist = Path('dist-payment-expense-final')
          stage = dist / 'LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL'
          archive = dist / 'LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL-SOURCE.zip'
          shutil.rmtree(dist, ignore_errors=True)
          stage.mkdir(parents=True)
          excluded_roots = {'.git', '.dart_tool', 'build', 'ci-logs', 'dist', '.gradle'}
          excluded_files = {'.flutter-plugins', '.flutter-plugins-dependencies', '.packages', 'local.properties'}
          for source in root.rglob('*'):
              relative = source.relative_to(root)
              if not relative.parts or any(part in excluded_roots for part in relative.parts) or source.name in excluded_files:
                  continue
              target = stage / relative
              if source.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
              for source in stage.rglob('*'):
                  if source.is_file():
                      output.write(source, source.relative_to(stage.parent))
          with zipfile.ZipFile(archive) as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f'Kaynak ZIP bozuk: {bad}')
          print(archive)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-payment-expense-final-diagnostics
          path: ${{ env.SOURCE_ROOT }}/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-payment-expense-final-screenshots
          path: ${{ env.SOURCE_ROOT }}/test/goldens/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-payment-expense-final-release
          path: ${{ env.SOURCE_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-payment-expense-final-source
          path: dist-payment-expense-final/LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
