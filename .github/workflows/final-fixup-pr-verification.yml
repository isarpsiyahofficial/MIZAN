name: MIZAN final fixup PR verification

on:
  pull_request:
    branches: [agent/mizan-safe-clear-ui-v2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: "3.44.0"
  SOURCE_ROOT: workspace/LEFFERION-PRIME-MIZAN-MANUAL-OVERDUE-SYNC-FINAL

jobs:
  verify-final-fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout final patch layer
        uses: actions/checkout@v4

      - name: Download exact verified source
        uses: actions/download-artifact@v4
        with:
          name: lefferion-prime-mizan-manual-overdue-sync-source
          repository: isarpsiyahofficial/MIZAN
          run-id: 30090668985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .baseline-artifact

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Reconstruct verify and package final fixup
        shell: bash
        run: bash tools/run_mizan_final_fixup_ci.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-final-fixup-pr-diagnostics
          path: ${{ env.SOURCE_ROOT }}/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-final-fixup-pr-screenshots
          path: ${{ env.SOURCE_ROOT }}/test/goldens/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-final-fixup-pr-release
          path: ${{ env.SOURCE_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-final-fixup-pr-source
          path: dist-final-fixup-pr/LEFFERION-PRIME-MIZAN-FINAL-FIXUP-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
