name: MIZAN notification performance final release

on:
  push:
    branches: [agent/mizan-notification-performance-report-final]
  pull_request:
    branches: [agent/mizan-observation-round2-final]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: "3.44.0"
  SOURCE_ROOT: workspace/LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout final patch layer
        uses: actions/checkout@v4

      - name: Download exact verified previous source
        uses: actions/download-artifact@v4
        with:
          name: lefferion-prime-mizan-observation-round2-final-source
          repository: isarpsiyahofficial/MIZAN
          run-id: 30164611232
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .baseline-artifact

      - name: Restore verified source and apply final patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          archives = sorted(Path('.baseline-artifact').rglob('*.zip'))
          if len(archives) != 1:
              raise SystemExit(f'Beklenen tek kaynak ZIP bulunamadı: {archives}')
          shutil.rmtree('workspace', ignore_errors=True)
          Path('workspace').mkdir()
          with zipfile.ZipFile(archives[0]) as outer:
              outer.extractall('workspace')
          nested = sorted(Path('workspace').rglob('*SOURCE.zip'))
          if nested:
              temporary = Path('workspace-unpacked')
              shutil.rmtree(temporary, ignore_errors=True)
              temporary.mkdir()
              with zipfile.ZipFile(nested[0]) as inner:
                  inner.extractall(temporary)
              shutil.rmtree('workspace')
              temporary.rename('workspace')
          roots = [p.parent for p in Path('workspace').rglob('pubspec.yaml')]
          if len(roots) != 1:
              raise SystemExit(f'Kaynak kökü tekil değil: {roots}')
          expected = Path('workspace/LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL')
          if roots[0] != expected:
              if expected.exists():
                  shutil.rmtree(expected)
              expected.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(roots[0]), str(expected))
          PY
          python3 tools/apply_mizan_notification_performance_final.py "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/pubspec.yaml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze, verify three times, test and build release
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          exec > >(tee ci-logs/notification-performance-final.log) 2>&1
          flutter create . --platforms=android --org com.lefferionprime --project-name lefferion_prime_mizan
          python3 tools/configure_android.py
          flutter pub get
          dart format lib test
          dart run flutter_launcher_icons

          for pass in 1 2 3; do
            echo "=== KOD KONTROL TURU $pass/3 ==="
            flutter analyze --fatal-warnings
            python3 tools/validate_project.py
            flutter test \
              test/notification_migration_test.dart \
              test/automatic_notification_sync_test.dart \
              test/reminder_engine_test.dart \
              test/notification_performance_report_final_test.dart \
              --reporter expanded
            flutter test \
              test/report_service_test.dart \
              test/combined_expense_totals_test.dart \
              test/performance_scaling_test.dart \
              --reporter expanded
          done

          flutter test test/csv_backup_test.dart test/controller_test.dart --reporter expanded
          flutter test test/responsive_test.dart test/ui_interaction_test.dart --reporter expanded
          flutter test test/pdf_report_test.dart --reporter expanded
          flutter test test/visual_capture_test.dart --update-goldens
          flutter test --reporter expanded
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/app/outputs/flutter-apk/app-release.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-notification-performance-final-diagnostics
          path: ${{ env.SOURCE_ROOT }}/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-notification-performance-final-screenshots
          path: ${{ env.SOURCE_ROOT }}/test/goldens/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-notification-performance-final-release
          path: ${{ env.SOURCE_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          root = Path('workspace/LEFFERION-PRIME-MIZAN-PAYMENT-EXPENSE-FINAL')
          dist = Path('dist-notification-performance-final')
          stage = dist / 'LEFFERION-PRIME-MIZAN-NOTIFICATION-PERFORMANCE-FINAL'
          archive = dist / 'LEFFERION-PRIME-MIZAN-NOTIFICATION-PERFORMANCE-FINAL-SOURCE.zip'
          shutil.rmtree(dist, ignore_errors=True)
          stage.mkdir(parents=True)
          excluded_roots = {'.git', '.dart_tool', 'build', 'ci-logs', '.gradle'}
          excluded_files = {'.flutter-plugins', '.flutter-plugins-dependencies', '.packages', 'local.properties'}
          for source in root.rglob('*'):
              relative = source.relative_to(root)
              if not relative.parts or any(part in excluded_roots for part in relative.parts) or source.name in excluded_files:
                  continue
              target = stage / relative
              if source.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as output:
              for source in stage.rglob('*'):
                  if source.is_file():
                      output.write(source, source.relative_to(stage.parent))
          with zipfile.ZipFile(archive) as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f'Kaynak ZIP bozuk: {bad}')
          print(archive)
          PY

      - name: Upload verified source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lefferion-prime-mizan-notification-performance-final-source
          path: dist-notification-performance-final/LEFFERION-PRIME-MIZAN-NOTIFICATION-PERFORMANCE-FINAL-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
